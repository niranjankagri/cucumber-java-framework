# Runs every Cucumber scenario in headless Chrome on every push and pull request to main,
# and on demand. The custom HTML report, Cucumber's own reports and the screenshots of
# failed scenarios are kept as a downloadable artifact of each run.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, without a code change: a broken dependency or a change outside the repository
    # shows up within a week (night in India, before the daily Quality Intelligence collection)
    - cron: '15 23 * * 2'   # Tuesday 23:15 UTC
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
# Grouped per event too, so the weekly run and a push run on main never cancel each other
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Scenarios (headless Chrome, JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven # reuses downloaded dependencies between runs (keyed on pom.xml)

      # Chrome is preinstalled on ubuntu-latest; Selenium Manager fetches the matching driver.
      - name: Run the scenarios
        run: mvn -B clean test -Dheadless=true -Dbrowser=chrome

      # Kept even when scenarios fail, so failures can be analysed
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-reports
          path: |
            target/cucumber-reports/
            target/screenshots/
          if-no-files-found: ignore
